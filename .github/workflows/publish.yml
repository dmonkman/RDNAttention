name: Build and publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      repository:
        description: "Index to publish to"
        type: choice
        default: testpypi
        options: [testpypi, pypi]

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml

  publish:
    name: Publish to ${{ inputs.repository || 'pypi' }}
    needs: [build]
    runs-on: ubuntu-latest
    environment: ${{ inputs.repository || 'pypi' }}
    permissions:
      id-token: write   # Trusted Publishing (OIDC) - no API token needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ (inputs.repository == 'testpypi' && 'https://test.pypi.org/legacy/') || '' }}
          print-hash: true
